# ClockworkPi uConsole has no Super/Windows key, and every Omarchy shortcut
# uses SUPER. Remap at the kernel input layer so it applies system wide:
# Hyprland, the TTY console, and every application.
#
# Left Alt  -> Super  (all Omarchy bindings)
# Right Alt -> Alt    (untouched, so Alt+Tab and menu keys still work)

[ids]
*

[main]
leftalt = leftmeta
